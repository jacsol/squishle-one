<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Squishle One</title>
<style>
:root{--bg:#fbf7ff;--ink:#2b2340;--mute:#7a7090;--card:#ffffff;--line:#e6dff2;--accent:#7c5cff;--accent-ink:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#171322;--ink:#f1ecff;--mute:#a79fc0;--card:#221c33;--line:#33294d;--accent:#9d86ff;--accent-ink:#171322}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;padding:0 16px 40px;min-height:100vh}
.wrap{max-width:480px;margin:0 auto}
header{display:flex;align-items:baseline;gap:8px;padding:14px 0 6px;user-select:none;-webkit-user-select:none}
#title{font-size:18px;margin:0;font-weight:700}
.tag{font-size:11px;color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:10px 0}
h2{font-size:20px;margin:0 0 6px}
p{margin:6px 0}
.mute{color:var(--mute);font-size:14px}
.btn{display:block;width:100%;min-height:50px;border-radius:14px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:600;cursor:pointer;padding:10px 14px;margin-top:12px}
.btn.alt{background:var(--card);color:var(--ink);border-color:var(--line)}
.btn:active{transform:scale(.98)}
.opt{display:block;width:100%;min-height:52px;text-align:left;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer;padding:10px 14px;margin-top:8px}
.opt:active{transform:scale(.98);border-color:var(--accent)}
.prog{font-size:13px;color:var(--mute);text-align:center;margin:2px 0}
.dots{display:flex;justify-content:center;gap:6px;margin:4px 0 0}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
#artbox{position:relative;width:100%;max-width:340px;aspect-ratio:1/1;margin:0 auto}
#artbox svg{width:100%;height:100%;display:block}
#art{width:100%;height:100%}
#bubble{position:absolute;left:50%;top:4%;transform:translateX(-50%);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
#bubble.show{opacity:1}
input[type=text]{width:100%;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;padding:8px 12px;margin-top:8px}
.badge{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:999px;padding:1px 10px;color:var(--mute);margin-right:6px}
#flash{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 40%,#fff 0,rgba(255,255,255,.85) 40%,rgba(255,255,255,0) 75%)}
#flash.go{animation:flash 1s ease-out}
@keyframes flash{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
.dev{border:1px dashed var(--line);border-radius:14px;padding:12px;margin-top:14px}
.dev h3{font-size:14px;margin:0 0 6px}
.dev .row{display:flex;flex-wrap:wrap;gap:6px}
.dev button{min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:14px;padding:6px 10px;cursor:pointer}
.dev pre{white-space:pre-wrap;word-break:break-all;font-size:11px;color:var(--mute);margin:8px 0 0}
.say{min-height:1.6em;text-align:center;font-style:italic;margin:8px 0 2px}
.two{display:flex;gap:10px}.two .btn{margin-top:8px}
.entry{border-top:1px solid var(--line);padding:8px 0}.entry:first-of-type{border-top:0}
.code{font:600 22px/1.3 ui-monospace,Menlo,monospace;letter-spacing:1px;text-align:center;background:var(--bg);border:1px dashed var(--line);border-radius:12px;padding:12px;user-select:all;-webkit-user-select:all}
textarea{width:100%;min-height:120px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:12px/1.4 ui-monospace,Menlo,monospace;padding:8px;margin-top:8px}
.keep{display:flex;align-items:center;gap:12px;border-top:1px solid var(--line);padding:8px 0}.keep:first-of-type{border-top:0}
.mini svg{width:84px;height:84px;display:block}
.btn.nav{padding:10px 4px;font-size:15px}
.btn[disabled]{opacity:.5;cursor:default}
/* animation */
.idle{transform-box:fill-box;transform-origin:50% 100%;animation:idle 3.2s ease-in-out infinite}
.wob{transform-box:fill-box;transform-origin:50% 100%;animation:wob var(--wob,1.8s) ease-in-out infinite}
@keyframes idle{0%,100%{transform:scale(1,1)}50%{transform:scale(1.03,.97)}}
@keyframes wob{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
#art.shake .wob{animation:shake .16s linear infinite}
@keyframes shake{0%{transform:rotate(-9deg) translateX(-3px)}50%{transform:rotate(9deg) translateX(3px)}100%{transform:rotate(-9deg) translateX(-3px)}}
.tw{animation:tw 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes tw{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1.1)}}
.pop{animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(1)}30%{transform:scale(1.08) rotate(-2deg)}60%{transform:scale(.97) rotate(2deg)}100%{transform:scale(1)}}
.rise{animation:rise .6s ease-out}
@keyframes rise{0%{opacity:0;transform:translateY(12px) scale(.9)}100%{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.idle,.wob,.tw,.pop,.rise,#art.shake .wob,#flash.go{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header><h1 id="title">Squishle One</h1><span class="tag">prototype</span></header>
  <main id="main"></main>
  <div id="dev"></div>
</div>
<div id="flash"></div>

<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s)};
var KEY="squishleOne.v1";           // own save key: never the same as Squishle v15.2
var CFG={NUDGE:0.2,QUIZ:0.33,MAXNAME:12,GAP:4*3600*1000,CAP:2,MUT:1/6,CARE:5,REGEN:3*3600*1000,AWAY:20*3600*1000,VISIT:30*60*1000,CARENUDGE:0.1,AWAYNUDGE:0.5,AWAYCAP:3};   // GAP = hours between choices, CAP = choices per calendar day, MUT = mutation chance per growth (first test round)
var STAGES=["Egg","Baby","Child","Teen","Adult"];
var SCALE=[0.8,0.62,0.76,0.9,1];
var LIMCAP=[0,0,0.4,0.75,1];
var KEYS=["eyes","arms","legs","aura","colour","pattern"];
var DRIVES={curious:["eyes","legs"],cautious:["arms"],kind:["colour"],ambitious:["aura","pattern"]};
var BASE={eyes:0.1,arms:0.1,legs:0.1,aura:0.1,colour:0.3,pattern:0.1};
var EGG={rx:0.78,ry:1,k:2,amp:0,ph:0,pear:0.35};
var GENERIC={name:"Egg",hue:265,sat:45,lig:80,dir:1,mult:{eyes:1,arms:1,legs:1,aura:1,colour:1,pattern:1},shape:EGG};
var BLOBS=[
 {name:"Pebble",wing:-0.3,hue:28,sat:42,lig:62,dir:1,line:"Steady and sturdy. It grows strong arms and legs.",mult:{eyes:0.5,arms:1.5,legs:1.5,aura:0.5,colour:1,pattern:1},shape:{rx:1.12,ry:0.84,k:3,amp:0.03,ph:0.4,pear:0}},
 {name:"Drip",wing:0.2,hue:197,sat:62,lig:62,dir:1,line:"Dreamy and glowy. It loves bright colours and a shimmering aura.",mult:{eyes:1,arms:0.5,legs:0.5,aura:1.5,colour:1.5,pattern:1},shape:{rx:0.9,ry:1,k:2,amp:0.02,ph:0,pear:1}},
 {name:"Spark",wing:0.4,hue:48,sat:78,lig:62,dir:-1,line:"Bright-eyed and quick. It lights up easily.",mult:{eyes:1.5,arms:1,legs:1,aura:1.5,colour:0.5,pattern:0.5},shape:{rx:1,ry:0.95,k:5,amp:0.05,ph:0.2,pear:0}},
 {name:"Puff",wing:0,hue:326,sat:62,lig:72,dir:1,line:"Soft and cosy. It loves colours and patterns.",mult:{eyes:1,arms:1,legs:0.5,aura:0.5,colour:1.5,pattern:1.5},shape:{rx:1.04,ry:0.98,k:8,amp:0.045,ph:0,pear:0}}
];
// Quiz: four "vibe" questions pick the blob (one point each), two personality questions give a small head start.
// Option order is rotated so the same blob is never always first.
var VIBE=[
 {q:"Pick a place for a free day",o:[{t:"Mountain trail",r:"the mountain trail",b:0},{t:"Beach",r:"the beach",b:1},{t:"City rooftop",r:"the city rooftop",b:2},{t:"Cosy cabin",r:"the cosy cabin",b:3}]},
 {q:"Pick a sound",o:[{t:"Rain on a window",r:"rain on a window",b:1},{t:"A purring cat",r:"a purring cat",b:3},{t:"Footsteps on gravel",r:"footsteps on gravel",b:0},{t:"Fireworks",r:"fireworks",b:2}]},
 {q:"Pick a snack",o:[{t:"Popping candy",r:"popping candy",b:2},{t:"Crusty bread",r:"crusty bread",b:0},{t:"Warm cookies",r:"warm cookies",b:3},{t:"Cold lemonade",r:"cold lemonade",b:1}]},
 {q:"Pick some weather",o:[{t:"Soft snowfall",r:"soft snowfall",b:3},{t:"Thunderstorm",r:"a thunderstorm",b:2},{t:"Misty drizzle",r:"a misty drizzle",b:1},{t:"Crisp clear morning",r:"a crisp clear morning",b:0}]}
];
var PERS=[
 {q:"A door appears in your garden. What do you do?",o:[{t:"Open it straight away",l:"curious"},{t:"Peek from a distance first",l:"cautious"}]},
 {q:"Your team has a challenge to do. What matters most?",o:[{t:"Everyone having fun",l:"kind"},{t:"Winning",l:"ambitious"}]}
];
var NQ=VIBE.length+PERS.length;
var HI=["Hi!","Boop!","Again!","Yay!","Hehe!","Hello!"];
var UP_AT={1:2,2:6,3:10};   // cumulative number of choices at which baby, child and teen end
// Daily choices. "a" = curious / kind, "b" = cautious / ambitious. Each day: one curious-or-cautious choice, then one kind-or-ambitious choice.
var CHOICES={
 cp:[
  {s:"A hole in the garden fence",a:{t:"Squeeze through",l:"I squeezed through and found a whole new garden!"},b:{t:"Peek through first",l:"I peeked first. I like knowing what's there."}},
  {s:"A strange hum from the cupboard",a:{t:"Open the door",l:"I opened it! Something was glowing in there."},b:{t:"Listen from outside",l:"I listened carefully and worked out what it was."}},
  {s:"A puddle with a ripple in it",a:{t:"Poke it",l:"I poked it. The ripples went on and on!"},b:{t:"Watch from the edge",l:"I watched the ripples from the edge. So pretty."}},
  {s:"Two paths in the woods",a:{t:"Take the unknown one",l:"I took the winding path and found a hidden hill."},b:{t:"Take the path you know",l:"I went my usual way and found my favourite spot."}},
  {s:"A box turns up at the door",a:{t:"Rip it open",l:"I tore it open. Surprise!"},b:{t:"Check it over first",l:"I checked it all over, then opened it slowly."}},
  {s:"Rustling in the bushes",a:{t:"Go and look",l:"I crept closer. It was a hedgehog!"},b:{t:"Wait for it to come out",l:"I waited, and a hedgehog came out to say hello."}}
 ],
 ka:[
  {s:"One big berry",a:{t:"Share it",l:"I split it with a friend. We both giggled."},b:{t:"Save it to grow big",l:"I saved it and felt stronger already."}},
  {s:"A wobbly tower of blocks",a:{t:"Help a friend with theirs",l:"I steadied a friend's tower. Teamwork!"},b:{t:"Build your own higher",l:"I built mine higher than ever!"}},
  {s:"A race along the stream",a:{t:"Run with a slow friend",l:"I ran at a friend's pace. The view was lovely."},b:{t:"Run for first place",l:"I ran my fastest and came first!"}},
  {s:"A tiny bird looks lost",a:{t:"Guide it home",l:"I walked the little bird home."},b:{t:"Keep going to the hilltop",l:"I kept climbing and reached the very top."}},
  {s:"A game with one prize",a:{t:"Cheer for everyone",l:"I cheered for everyone. Best game ever."},b:{t:"Play to win",l:"I played my hardest and won the prize!"}},
  {s:"One umbrella, rain coming",a:{t:"Share it",l:"We squeezed under together and stayed dry."},b:{t:"Race to the shelter",l:"I raced to the shelter, dry and proud."}}
 ]
};

// ---------- helpers ----------
function clamp(x){return Math.max(0,Math.min(1,x));}
function hsl(h,s,l,a){if(a===undefined)a=1;return "hsla("+(((h%360)+360)%360).toFixed(0)+","+Math.max(0,Math.min(100,s)).toFixed(0)+"%,"+Math.max(0,Math.min(100,l)).toFixed(0)+"%,"+a+")";}
function rng(seed){var a=seed>>>0;return function(){a=(a+0x6D2B79F5)>>>0;var t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function bodyPath(sh,R){
  var pts=[];
  for(var i=0;i<72;i++){
    var th=i/72*Math.PI*2;
    var r=1+sh.amp*Math.cos(sh.k*th+sh.ph);
    var x=Math.cos(th)*sh.rx*r, y=Math.sin(th)*sh.ry*r;
    var top=Math.max(0,-Math.sin(th));
    x*=1-sh.pear*0.5*Math.pow(top,1.3);
    if(y<0)y*=1+sh.pear*0.16;
    pts.push((x*R).toFixed(1)+","+(y*R).toFixed(1));
  }
  return "M"+pts.join("L")+"Z";
}
function star(cx,cy,r,fill,cls,delay){
  cx=+cx;cy=+cy;r=+r;
  var d="M"+cx+","+(cy-r)+" L"+(cx+r*0.28)+","+(cy-r*0.28)+" L"+(cx+r)+","+cy+" L"+(cx+r*0.28)+","+(cy+r*0.28)+" L"+cx+","+(cy+r)+" L"+(cx-r*0.28)+","+(cy+r*0.28)+" L"+(cx-r)+","+cy+" L"+(cx-r*0.28)+","+(cy-r*0.28)+"Z";
  return '<path d="'+d+'" fill="'+fill+'" class="'+cls+'" style="animation-delay:'+delay+'s"/>';
}

// ---------- the procedural creature (from the approved look test, with the rough edges fixed) ----------
function drawCreature(b,n,stage,v,mut,seed,u,pose){
  var B=b<0?GENERIC:BLOBS[b], egg=stage===0, R=95*SCALE[stage], cap=LIMCAP[stage];
  var eyeE=n.eyes, armE=Math.min(n.arms,cap), legE=Math.min(n.legs,cap);
  var hue=B.hue+B.dir*(n.colour-0.3)*40, sat=B.sat+n.colour*14, lig=B.lig;   // colour range limited
  var dark=hsl(hue,sat+5,lig-17), light=hsl(hue,sat-6,lig+14);
  var ink="#2b2340";
  var sh=egg?EGG:B.shape;
  var path=bodyPath(sh,R);
  var rnd=rng(seed*31+(b<0?5:b)*7+1);
  var long=v.limb==="long";
  var legLen=(!egg&&legE>0.03)?R*0.55*legE*(long?1.6:1):0;
  var out=[];
  out.push('<defs>');
  var stopA=light, stopB=dark;
  if(mut==="shimmer"){stopA=hsl(hue,sat+10,lig+16);stopB=hsl(hue+75,sat+15,lig+2);}
  out.push('<radialGradient id="g'+u+'" cx="38%" cy="30%" r="80%"><stop offset="0" stop-color="'+stopA+'"/><stop offset="1" stop-color="'+stopB+'"/></radialGradient>');
  out.push('<radialGradient id="a'+u+'"><stop offset="0" stop-color="'+hsl(hue+40,95,66,0.15+0.55*n.aura)+'"/><stop offset="1" stop-color="'+hsl(hue+40,95,66,0)+'"/></radialGradient>');
  out.push('<radialGradient id="e'+u+'"><stop offset="0" stop-color="rgba(120,245,255,.95)"/><stop offset="1" stop-color="rgba(120,245,255,0)"/></radialGradient>');
  out.push('<clipPath id="c'+u+'"><path d="'+path+'"/></clipPath>');
  out.push('</defs>');
  var shift=10-legLen*0.5;
  out.push('<g transform="translate(0,'+shift.toFixed(1)+')">');
  if(mut==="rainbow"){
    var cols=[0,60,120,190,260,310];
    for(var i=0;i<cols.length;i++){
      out.push('<circle cx="0" cy="0" r="'+(R*(1.5-i*0.12)).toFixed(1)+'" fill="'+hsl(cols[i],90,62,0.16)+'"/>');
    }
  } else if(n.aura>0.04&&!egg){
    out.push('<circle cx="0" cy="0" r="'+(R*(1.1+0.55*n.aura)).toFixed(1)+'" fill="url(#a'+u+')"/>');
  }
  var floor=sh.ry*R*0.98+legLen;
  out.push('<ellipse cx="0" cy="'+(floor+R*0.06).toFixed(1)+'" rx="'+(R*0.8).toFixed(1)+'" ry="'+(R*0.09).toFixed(1)+'" fill="rgba(0,0,0,.13)"/>');
  out.push('<g class="'+(egg?"wob":"idle")+'">');
  if(legLen>0){
    var lw=R*(long?0.17:0.22);
    [-1,1].forEach(function(s){
      var x=s*sh.rx*R*0.42, y0=sh.ry*R*0.62, y1=sh.ry*R*0.97+legLen;
      out.push('<line x1="'+x.toFixed(1)+'" y1="'+y0.toFixed(1)+'" x2="'+x.toFixed(1)+'" y2="'+y1.toFixed(1)+'" stroke="'+dark+'" stroke-width="'+lw.toFixed(1)+'" stroke-linecap="round"/>');
    });
  }
  if(!egg&&armE>0.03){
    if(v.limb==="wings"&&stage>=2){
      var W=R*(0.12+0.5*armE);
      [-1,1].forEach(function(s){
        var ox=s*sh.rx*R*0.85, oy=-R*0.05;
        var d="M0,0 C"+(0.6*W)+","+(-0.9*W)+" "+(1.5*W)+","+(-0.8*W)+" "+(1.4*W)+","+(-0.2*W)+" C"+(1.2*W)+","+(0.1*W)+" "+(0.9*W)+","+(0.2*W)+" "+(0.7*W)+","+(0.26*W)+" C"+(0.6*W)+","+(0.5*W)+" "+(0.3*W)+","+(0.5*W)+" 0,"+(0.3*W)+"Z";
        out.push('<g transform="translate('+ox.toFixed(1)+','+oy.toFixed(1)+') scale('+s+',1) rotate(-12)"><path d="'+d+'" fill="'+light+'" stroke="'+dark+'" stroke-width="2" stroke-linejoin="round"/></g>');
      });
    } else {
      var P=R*0.55*armE*(long?1.6:1), aw=R*(long?0.12:0.15), ang=35*Math.PI/180;
      [-1,1].forEach(function(s){
        var ex=s*sh.rx*R*0.93, ey=R*0.08, dx=s*Math.cos(ang), dy=Math.sin(ang);
        out.push('<line x1="'+(ex-dx*R*0.3).toFixed(1)+'" y1="'+(ey-dy*R*0.3).toFixed(1)+'" x2="'+(ex+dx*P).toFixed(1)+'" y2="'+(ey+dy*P).toFixed(1)+'" stroke="'+dark+'" stroke-width="'+(aw*2).toFixed(1)+'" stroke-linecap="round"/>');
      });
    }
  }
  var topY=-sh.ry*R*(1+sh.pear*0.16);
  if(!egg&&stage>=3&&v.topper==="horns"){
    var hx=sh.pear>0.5?0.2*R:0.36*R, hy=topY+R*0.22;
    [-1,1].forEach(function(s){
      var d="M"+(s*hx-s*R*0.15)+","+hy+" Q"+(s*hx+s*R*0.0)+","+(hy-R*0.28)+" "+(s*hx+s*R*0.16)+","+(hy-R*0.46)+" Q"+(s*hx+s*R*0.2)+","+(hy-R*0.1)+" "+(s*hx+s*R*0.15)+","+hy+"Z";
      out.push('<path d="'+d+'" fill="hsl(45,75%,86%)" stroke="'+ink+'" stroke-width="2.5" stroke-linejoin="round"/>');
    });
  }
  out.push('<path d="'+path+'" fill="url(#g'+u+')" stroke="'+dark+'" stroke-width="2.5" stroke-linejoin="round"/>');
  var pa=egg?0.5:n.pattern;
  if(pa>0.04){
    out.push('<g clip-path="url(#c'+u+')">');
    if(egg||v.pat==="spots"){
      var cnt=Math.round(3+pa*10);
      for(var k=0;k<cnt;k++){
        var px=0,py=0,pr=0,tries=0,ok=false;
        while(tries<8&&!ok){
          var an=rnd()*Math.PI*2, rad=Math.sqrt(rnd())*0.85;
          px=Math.cos(an)*sh.rx*R*rad; py=Math.sin(an)*sh.ry*R*rad; pr=R*(0.05+rnd()*0.07);
          ok=egg||!(Math.abs(px)<R*0.66&&py>-R*0.32&&py<R*0.36);   // keep spots off the face
          tries++;
        }
        if(ok)out.push('<circle cx="'+px.toFixed(1)+'" cy="'+py.toFixed(1)+'" r="'+pr.toFixed(1)+'" fill="'+hsl(hue-12,sat+8,lig-22,0.22+pa*0.4)+'"/>');
      }
    } else {
      var sc=2+Math.round(pa*6), gap=(R*2.2)/sc;
      for(var q=0;q<sc;q++){
        out.push('<rect x="'+(-R*1.6).toFixed(1)+'" y="'+(-R*1.1+q*gap).toFixed(1)+'" width="'+(R*3.2).toFixed(1)+'" height="'+(R*0.07+pa*R*0.05).toFixed(1)+'" transform="rotate(-25)" fill="'+hsl(hue-12,sat+8,lig-24,0.22+pa*0.38)+'"/>');
      }
    }
    out.push('</g>');
  }
  if(!egg&&stage>=3&&v.topper==="fluff"){
    var fr=R*0.15;
    [[0,0,1.1],[-0.15,0.05,0.9],[0.15,0.05,0.9],[-0.28,0.13,0.7],[0.28,0.13,0.7]].forEach(function(f){
      out.push('<circle cx="'+(f[0]*R).toFixed(1)+'" cy="'+(topY+R*0.03+f[1]*R).toFixed(1)+'" r="'+(fr*f[2]).toFixed(1)+'" fill="hsl(0,0%,98%)" stroke="'+hsl(hue,sat-10,lig-8,0.6)+'" stroke-width="1.5"/>');

        out.push('<circle cx="'+cx.toFixed(1)+'" cy="'+(ey2+er*0.38).toFixed(1)+'" r="'+(er*0.5).toFixed(1)+'" fill="'+pupil+'"/>');
        out.push('<path d="M'+(cx-er*1.15).toFixed(1)+','+(ey2+er*0.05).toFixed(1)+' Q'+cx.toFixed(1)+','+(ey2-er*0.35).toFixed(1)+' '+(cx+er*1.15).toFixed(1)+','+(ey2+er*0.05).toFixed(1)+'" fill="none" stroke="'+ink+'" stroke-width="2.5" stroke-linecap="round"/>');

        out.push('<circle cx="'+(cx-er*0.2).toFixed(1)+'" cy="'+(ey2-er*0.22).toFixed(1)+'" r="'+(er*0.2).toFixed(1)+'" fill="#fff"/>');

    });

    if(pose==="sleep"){
      out.push('<text x="'+(R*0.85).toFixed(1)+'" y="'+(-R*0.85).toFixed(1)+'" font-size="'+(R*0.34).toFixed(0)+'" font-weight="700" fill="'+dark+'" class="tw">z</text>');
      out.push('<text x="'+(R*1.05).toFixed(1)+'" y="'+(-R*1.1).toFixed(1)+'" font-size="'+(R*0.26).toFixed(0)+'" font-weight="700" fill="'+dark+'" class="tw" style="animation-delay:.5s">z</text>');

    for(var z=0;z<6;z++){

  return '<svg viewBox="'+(-half)+' '+(-half)+' '+(half*2)+' '+(half*2)+'" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="'+(egg?"An egg":"Your Squishle")+'">'+out.join("")+'</svg>';

var G=load();
function fresh(){return {v:1,phase:"intro",seed:Math.floor(Math.random()*1e9),answers:[],c:null,dev:false,keep:[],plog:[]};}
function load(){
  try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);if(o&&o.v===1&&o.phase){if(o.c)norm(o.c);o.keep=o.keep||[];o.plog=o.plog||[];return o;}}}catch(e){}
  return fresh();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(G));}catch(e){}}
function wipe(){try{localStorage.removeItem(KEY);}catch(e){}G=fresh();}

// ---------- quiz logic ----------
function pickBlob(answers,seed){
  var pts=[0,0,0,0];
  for(var i=0;i<VIBE.length;i++){var a=answers[i];if(a!==undefined&&VIBE[i].o[a])pts[VIBE[i].o[a].b]++;}
  var max=Math.max.apply(null,pts), tied=[];
  for(var b=0;b<4;b++)if(pts[b]===max)tied.push(b);
  var pick=tied.length===1?tied[0]:tied[Math.floor(rng(seed)()*tied.length)];
  return {blob:pick,pts:pts,tied:tied.length>1};
}
function leansFrom(answers){
  var ls=[];
  for(var i=0;i<PERS.length;i++){var a=answers[VIBE.length+i];if(a!==undefined&&PERS[i].o[a])ls.push(PERS[i].o[a].l);}
  return ls;
}
function reasonFor(answers,res){
  var rs=[];
  for(var i=0;i<VIBE.length;i++){var o=VIBE[i].o[answers[i]];if(o&&o.b===res.blob)rs.push(o.r);}
  var txt;
  if(rs.length===0)txt="";
  else if(rs.length===1)txt=rs[0];
  else txt=rs.slice(0,-1).join(", ")+" and "+rs[rs.length-1];
  var nm=BLOBS[res.blob].name;
  if(res.tied)return "It was a close call, but your egg chose "+nm+(txt?" (you picked "+txt+")":"")+".";
  return "You picked "+txt+", so you hatched "+(/^[AEIOU]/.test(nm)?"an ":"a ")+nm+".";
}
function makeCreature(b,leans,seed,reason){
  var n={};KEYS.forEach(function(k){n[k]=BASE[k];});
  leans.forEach(function(l){DRIVES[l].forEach(function(k){n[k]=clamp(n[k]+CFG.NUDGE*CFG.QUIZ*BLOBS[b].mult[k]);});});
  var c={blob:b,n:n,v:{limb:"stub",topper:"none",eye:"round",pat:"spots"},mut:"none",seed:seed%100000,name:"Squish",born:Date.now(),stage:1,hist:[],log:[],quizLeans:leans,reason:reason||""};
  norm(c);return c;
}

// ---------- step 2: choices and growing up ----------
function perm(seed,n){var a=[],i;for(i=0;i<n;i++)a.push(i);var r=rng(seed);for(i=n-1;i>0;i--){var j=Math.floor(r()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function SP(){return (G&&G.speed)||1;}             // test speed: 1 = real time
function DAYMS(){return 86400000/SP();}
function dayStart(t){if(SP()>1){var m=DAYMS();return Math.floor(t/m)*m;}var d=new Date(t);d.setHours(0,0,0,0);return d.getTime();}
function nextChoice(c){
  var idx=c.hist.length, axis=idx%2===0?"cp":"ka", k=Math.floor(idx/2);
  var order=perm(c.seed*17+(axis==="cp"?1:2),6);
  return {axis:axis,sc:CHOICES[axis][order[k%6]],flip:rng(c.seed*29+idx)()<0.5};
}
function choiceState(c){
  if(c.stage>=4)return {mode:"adult"};
  if(G.fast)return {mode:"ready"};
  var now=Date.now(),h=c.hist,last=h.length?h[h.length-1].t:0;
  var ds=dayStart(now),today=0;h.forEach(function(x){if(x.t>=ds)today++;});
  var until=0;
  if(today>=CFG.CAP)until=ds+DAYMS();
  if(last&&now<last+(CFG.GAP/SP()))until=Math.max(until,last+(CFG.GAP/SP()));
  if(until>now)return {mode:"wait",until:until,capped:today>=CFG.CAP};
  return {mode:"ready"};
}
function fmtWait(ms){
  var m=Math.max(1,Math.ceil(ms/60000)),h=Math.floor(m/60);
  return h>0?h+"h "+(m%60)+"m":m+"m";
}
function nightShare(c){
  var ts=(c.vis&&c.vis.length>=3)?c.vis:c.hist.map(function(x){return x.t;});
  if(!ts.length)return 0;
  var n=0;ts.forEach(function(t){var hr=new Date(t).getHours();if(hr>=20||hr<6)n++;});
  return n/ts.length;
}
// Limbs: wings or long. Decided by several things added together (positive = wings):
// curious vs cautious choices (+1 / -1 each), the quiz door answer (+/-0.5), play vs feed so far (up to +/-0.75),
// the blob's own tilt (Pebble -0.3, Drip +0.2, Spark +0.4, Puff 0), and an inherited limb from bonding (+/-0.5).
function limbScore(c){
  var inh=c.inh||{},s=0;
  c.hist.forEach(function(x){if(x.a==="curious")s+=1;else if(x.a==="cautious")s-=1;});
  (c.quizLeans||[]).forEach(function(l){if(l==="curious")s+=0.5;else if(l==="cautious")s-=0.5;});
  var cn=c.cnt||{feed:0,play:0};
  s+=Math.max(-1,Math.min(1,(cn.play-cn.feed)/5))*0.75;
  s+=BLOBS[c.blob].wing||0;
  if(inh.limb==="wings")s+=0.5;else if(inh.limb==="long")s-=0.5;
  return s;
}
function growUp(c){
  c.stage++;
  var L=[],h=c.hist,inh=c.inh||{};
  var cnt=function(a){return h.filter(function(x){return x.a===a;}).length;};
  var r=rng(c.seed*7+c.stage*131+h.length);
  if(c.stage===2){
    L.push("I'm a child now!");
    var ls=limbScore(c);
    var wings=ls>0?true:(ls<0?false:r()<0.5);
    c.v.limb=wings?"wings":"long";
    L.push(wings?"I've got wings! All that exploring paid off.":"My arms and legs grew long and steady. All that careful thinking!");
  } else if(c.stage===3){
    L.push("I'm a teen now!");
    var ki=cnt("kind")+(inh.topper==="fluff"?0.5:0),am=cnt("ambitious")+(inh.topper==="horns"?0.5:0);
    var fl=ki>am?true:(am>ki?false:r()<0.5);
    c.v.topper=fl?"fluff":"horns";
    L.push(fl?"A fluffy tuft grew on my head. All that kindness!":"Little horns! All that striving paid off.");
    var thr=inh.eye==="sleepy"?0.35:(inh.eye==="round"?0.65:0.5);
    var night=nightShare(c)>=thr;
    c.v.eye=night?"sleepy":"round";
    L.push(night?"My eyes have gone sleepy. I do love the evenings.":"My eyes are bright and round. I love the daytime.");
  } else if(c.stage===4){
    L.push("I'm all grown up!");
    var par=0;(G.answers||[]).forEach(function(a){par+=a;});
    c.v.pat=inh.pat?inh.pat:(par%2===0?"spots":"stripes");
    L.push(c.v.pat==="spots"?"My spots are here to stay.":"I've got stripes!");
  }
  var rate=G.forceMut?1:Math.min(1,(G.mutRate||CFG.MUT)*(c.mutBoost||1));
  if(c.mut==="none"&&r()<rate){
    c.mut=["eyes","shimmer","rainbow"][Math.floor(r()*3)];
    L.push("Something strange stirred in the night...");
  }
  G.forceMut=false;
  plog("grow",{s:c.stage,m:c.mut});
  L.forEach(function(x){c.log.push({t:Date.now(),k:"grow",x:x});});
  return L;
}
function applyChoice(side){
  var c=G.c, nc=nextChoice(c), o=nc.sc[side];
  c.log=c.log||[];c.hist=c.hist||[];
  var lean=nc.axis==="cp"?(side==="a"?"curious":"cautious"):(side==="a"?"kind":"ambitious");
  DRIVES[lean].forEach(function(k){c.n[k]=clamp(c.n[k]+CFG.NUDGE*BLOBS[c.blob].mult[k]);});
  c.hist.push({a:lean,l:o.l,t:Date.now()});
  c.lastSeen=Date.now();c.sleep=false;G.welcome=null;plog("choice",{l:lean,s:c.stage});
  c.log.push({t:Date.now(),k:"choice",x:o.l});
  var lines=null;
  if(UP_AT[c.stage]&&c.hist.length>=UP_AT[c.stage])lines=growUp(c);
  return {line:o.l,lines:lines};
}
var homeT=null,sayNext=null,popNext=false;
function takeChoice(side){
  var c=G.c; if(!c||choiceState(c).mode!=="ready")return;
  var r=applyChoice(side);
  G.pending=r.lines?{lines:r.lines,choice:r.line}:null;
  sayNext=r.lines?null:r.line;popNext=true;
  save();render();
}

function careBtn(c,k,label){

function wake(){var c=G.c;c.sleep=false;G.welcome=null;c.lastSeen=Date.now();save();render();}

  }
  if(st.mode==="ready"){

  }

  html+='<div class="two"><button class="btn alt nav" data-v="diary">Diary</button><button class="btn alt nav" data-v="bond">Bonding</button><button class="btn alt nav" data-v="data">Data</button><button class="btn alt nav" data-v="settings">Settings</button></div>';
  main.innerHTML=html;
  setArt(drawCreature(c.blob,c.n,c.stage,c.v,c.mut,c.seed,"h",c.sleep?"sleep":""));

// ---------- step 3: care, visit rhythm, away, diary ----------
var FEED_SAY=["Yum!","Nom nom nom!","More please!","That was tasty.","Mmm, berries!","My tummy is happy."];
var PLAY_SAY=["Wheee!","Again, again!","I bounced so high!","That was fun!","Catch me!","Boing boing!"];
var FEED_LOG=["I got fed today. I felt warm all over.","Snack time! I think my colours like it.","A good meal makes the world look brighter."];
var PLAY_LOG=["We played today. My legs felt bouncy.","I ran around until I was dizzy. The best.","Playing makes me want to jump even higher."];
var AWAY_SLEEP=["I took a long nap while you were gone.","I curled up and dreamed about puddles.","It was quiet, so I snoozed. Zzz.","I waited for you, then fell asleep."];
var WELCOME=["You're back! I missed you.","Oh, hello! I was just dreaming.","Yay, you came back!","There you are!"];
var AWAY_GROW={eyes:"I looked at everything while you were away and my eyes feel bigger.",arms:"I did some stretching while you were away. My arms feel stronger.",legs:"I practised hopping while you were away.",aura:"I glowed softly to myself while you were away.",colour:"I soaked up some sunshine while you were away and my colours deepened.",pattern:"I looked at my own pattern while you were away. It looks clearer now."};
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function norm(c){
  c.log=c.log||[];c.hist=c.hist||[];c.vis=c.vis||[];c.awayN=c.awayN||{};c.cl=c.cl||{};c.cnt=c.cnt||{feed:0,play:0};
  if(!c.care)c.care={feed:{n:CFG.CARE,t:Date.now()},play:{n:CFG.CARE,t:Date.now()}};
  if(!c.lastSeen)c.lastSeen=Date.now();
  if(!c.dp)c.dp={d:0,p:[]};
  if(!c.gen)c.gen=1;
  if(c.log.length>300)c.log=c.log.slice(-300);
}
function plog(e,d){
  G.plog=G.plog||[];var o={t:Date.now(),e:e};if(d)o.d=d;
  G.plog.push(o);if(G.plog.length>600)G.plog.shift();
}
function chargeInfo(c,k){
  var o=c.care[k],now=Date.now(),n=o.n,t=o.t;
  if(n<CFG.CARE){var add=Math.floor((now-t)/(CFG.REGEN/SP()));n=Math.min(CFG.CARE,n+add);t=n>=CFG.CARE?now:t+add*(CFG.REGEN/SP());}
  return {n:n,t:t,next:n<CFG.CARE?t+(CFG.REGEN/SP()):0};
}
function doCare(kind){
  var c=G.c;if(!c||G.phase!=="home")return;norm(c);
  var info=chargeInfo(c,kind),now=Date.now();
  if(!G.fast&&info.n<1)return;
  if(!G.fast)c.care[kind]={n:info.n-1,t:info.n>=CFG.CARE?now:info.t};
  c.sleep=false;G.welcome=null;c.lastSeen=now;
  var key=kind==="feed"?"colour":"legs";
  if(c.stage<4)c.n[key]=clamp(c.n[key]+CFG.NUDGE*CFG.CARENUDGE*BLOBS[c.blob].mult[key]);
  var ds=dayStart(now);
  if(c.cl[kind]!==ds){c.cl[kind]=ds;c.log.push({t:now,k:"care",x:pick(kind==="feed"?FEED_LOG:PLAY_LOG)});}
  c.cnt[kind]=(c.cnt[kind]||0)+1;
  plog(kind,{s:c.stage});
  sayNext=pick(kind==="feed"?FEED_SAY:PLAY_SAY);popNext=true;
  save();render();
}
function noteVisit(){
  var c=G.c;if(!c||G.phase!=="home")return;
  norm(c);
  var now=Date.now(),gap=now-c.lastSeen;
  if(gap<(CFG.VISIT/SP()))return;                 // same visit
  plog("open");
  c.vis.push(now);if(c.vis.length>60)c.vis.shift();
  var lines=[];
  if(gap>=(CFG.AWAY/SP())){
    c.sleep=true;
    lines.push(pick(AWAY_SLEEP));
    var sk="s"+c.stage;
    if(c.stage<4&&(c.awayN[sk]||0)<CFG.AWAYCAP&&c.lastAwayDay!==dayStart(now)){
      var mult=BLOBS[c.blob].mult;
      var cand=KEYS.filter(function(k){return mult[k]>=1;});
      var r=rng(c.seed*13+c.hist.length*7+c.vis.length);
      var k=cand[Math.floor(r()*cand.length)];
      c.n[k]=clamp(c.n[k]+CFG.NUDGE*CFG.AWAYNUDGE*mult[k]);
      c.awayN[sk]=(c.awayN[sk]||0)+1;c.lastAwayDay=dayStart(now);
      lines.push(AWAY_GROW[k]);
      plog("away",{k:k});
    }
    lines.push(pick(WELCOME));
  }
  // visit rhythm: visiting in a new part of the day nudges Pattern a little
  var part=Math.floor(new Date(now).getHours()/6),ds=dayStart(now);
  if(c.dp.d!==ds)c.dp={d:ds,p:[]};
  if(c.dp.p.indexOf(part)<0){c.dp.p.push(part);if(c.stage<4)c.n.pattern=clamp(c.n.pattern+CFG.NUDGE*CFG.CARENUDGE*BLOBS[c.blob].mult.pattern);}
  c.lastSeen=now;
  if(lines.length){G.welcome=lines;lines.forEach(function(x){c.log.push({t:now,k:"away",x:x});});}
  save();
}
function dayNo(c,t){return Math.floor((dayStart(t)-dayStart(c.born))/86400000)+1;}
function hhmm(t){var d=new Date(t);return ("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2);}
function renderDiary(){

  items.forEach(function(x){h+='<div class="entry"><span class="mute">Day '+dayNo(c,x.t)+' · '+hhmm(x.t)+'</span><div>“'+esc(x.x)+'”</div></div>';});

// ---------- step 4: bonding code, play log, backup ----------
var ALPH="0123456789ABCDEFGHJKMNPQRSTVWXYZ";
var LIMBS=["stub","long","wings"],TOPS=["none","fluff","horns"],MUTS=["none","eyes","shimmer","rainbow"];
function packBits(vals){var bits=[];vals.forEach(function(p){for(var i=p[1]-1;i>=0;i--)bits.push((p[0]>>i)&1);});return bits;}
function takeBits(bits,pos,n){var v=0;for(var i=0;i<n;i++)v=v*2+bits[pos+i];return v;}
function checksum(bits){var s=0;for(var i=0;i<bits.length;i++)s=(s*31+bits[i]*7+i+1)%251;return s;}
function toCode(c){
  var q=function(x){return Math.round(clamp(x)*15);};
  var vals=[[c.blob,2]];KEYS.forEach(function(k){vals.push([q(c.n[k]),4]);});
  vals.push([Math.max(0,LIMBS.indexOf(c.v.limb)),2],[Math.max(0,TOPS.indexOf(c.v.topper)),2],[c.v.eye==="sleepy"?1:0,1],[c.v.pat==="stripes"?1:0,1],[Math.max(0,MUTS.indexOf(c.mut)),2],[c.seed%65536,16]);
  var bits=packBits(vals);
  bits=bits.concat(packBits([[checksum(bits),8]]),[0,0]);
  var out="";for(var i=0;i<12;i++)out+=ALPH.charAt(takeBits(bits,i*5,5));
  return "SQ-"+out.slice(0,4)+"-"+out.slice(4,8)+"-"+out.slice(8,12);
}
function fromCode(str){
  var t=String(str||"").toUpperCase().replace(/[^0-9A-Z]/g,"").replace(/[IL]/g,"1").replace(/O/g,"0").replace(/U/g,"V");
  if(t.length===14&&t.slice(0,2)==="SQ")t=t.slice(2);
  if(t.length!==12)return null;
  var bits=[];
  for(var i=0;i<12;i++){var v=ALPH.indexOf(t.charAt(i));if(v<0)return null;for(var b=4;b>=0;b--)bits.push((v>>b)&1);}
  if(checksum(bits.slice(0,50))!==takeBits(bits,50,8))return null;
  var g={blob:takeBits(bits,0,2),n:{},v:{},mut:"none",seed:0},pos=2;
  KEYS.forEach(function(k){g.n[k]=takeBits(bits,pos,4)/15;pos+=4;});
  var li=takeBits(bits,26,2),to=takeBits(bits,28,2);
  if(li>2||to>2)return null;
  g.v={limb:LIMBS[li],topper:TOPS[to],eye:takeBits(bits,30,1)?"sleepy":"round",pat:takeBits(bits,31,1)?"stripes":"spots"};
  g.mut=MUTS[takeBits(bits,32,2)];g.seed=takeBits(bits,34,16);
  return g;
}
function hs(str){var h=5381;for(var i=0;i<str.length;i++)h=((h<<5)+h+str.charCodeAt(i))>>>0;return h;}
function geneObj(c){return fromCode(toCode(c));}
function bond(fr){
  var me=G.c,mg=geneObj(me),mc=toCode(me),fc=toCode({blob:fr.blob,n:fr.n,v:fr.v,mut:fr.mut,seed:fr.seed});
  var order=mc<fc?[mg,fr]:[fr,mg];
  var r=rng(hs([mc,fc].sort().join("|")));
  var blob=order[r()<0.5?0:1].blob;
  var egg=makeCreature(blob,[],Math.floor(r()*100000),"This egg came from your "+BLOBS[me.blob].name+" and a friend's "+BLOBS[fr.blob].name+". It takes after the "+BLOBS[blob].name+".");
  KEYS.forEach(function(k){var avg=(mg.n[k]+fr.n[k])/2;egg.n[k]=clamp(BASE[k]+0.25*(avg-BASE[k]));});
  egg.inh={};
  ["limb","topper","eye","pat"].forEach(function(slot){var v=order[r()<0.5?0:1].v[slot];if(v!=="stub"&&v!=="none")egg.inh[slot]=v;});
  egg.mutBoost=(mg.mut!=="none"||fr.mut!=="none")?2:1;
  egg.gen=(me.gen||1)+1;
  G.keep=G.keep||[];G.keep.push({c:me});
  plog("bond",{a:me.blob,b:fr.blob,g:egg.gen});
  G.c=egg;G.phase="reveal";G.playHatch=true;G.pending=null;G.welcome=null;VIEW="home";
  save();render();
}

  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(function(){done&&done();},fb);else fb();
}

      if(!window.confirm("Hatch a new egg? "+c.name+" will move to your keepsakes."))return;

function reportText(){
  var P=G.plog||[],c=G.c,L=[];
  L.push("Squishle One test report (step 4 build)"+(SP()>1?" - TEST SPEED x"+SP()+" (days in this report are shortened days)":"")+(G.fast?" - instant mode used":""));
  if(!P.length||!c){L.push("No activity recorded yet.");return L.join("\n");}
  var t0=P[0].t,vis={},days={},feeds=0,plays=0,aways=0,bonds=0,adultAt=null;
  var dn=function(t){return Math.floor((dayStart(t)-dayStart(t0))/86400000)+1;};
  P.forEach(function(x){
    var d=dn(x.t);days[d]=1;
    if(x.e==="open"||x.e==="hatch")vis[d]=(vis[d]||0)+1;
    if(x.e==="feed")feeds++;if(x.e==="play")plays++;if(x.e==="away")aways++;if(x.e==="bond")bonds++;
    if(x.e==="grow"&&x.d&&x.d.s===4&&adultAt===null)adultAt=d;
  });
  var d0=new Date(t0);
  L.push("Started: "+d0.getFullYear()+"-"+("0"+(d0.getMonth()+1)).slice(-2)+"-"+("0"+d0.getDate()).slice(-2));
  var vd=Object.keys(vis).map(Number).sort(function(a,b){return a-b;});
  L.push("Days with a visit: "+vd.join(", "));
  L.push("Visits per day: "+vd.map(function(d){return "day "+d+" = "+vis[d];}).join("; "));
  L.push("Visited on day 2: "+(vis[2]?"yes":"no")+" | day 3: "+(vis[3]?"yes":"no")+" | two or more visits in one day: "+(vd.some(function(d){return vis[d]>=2;})?"yes":"no"));
  L.push("Reached adult: "+(adultAt!==null?"yes, on day "+adultAt:"no")+" | bonds made: "+bonds);
  L.push("Creature: "+BLOBS[c.blob].name+", "+STAGES[c.stage]+", gen "+(c.gen||1)+", limbs "+c.v.limb+", topper "+c.v.topper+", eyes "+c.v.eye+", pattern "+c.v.pat+", mutation "+c.mut);
  L.push("Choices "+c.hist.length+" | feeds "+feeds+" | plays "+plays+" | away boosts "+aways);
  L.push("");L.push("Events (day, time, what):");
  P.slice(-250).forEach(function(x){
    var d=x.d?" "+Object.keys(x.d).map(function(k){return k+"="+x.d[k];}).join(","):"";
    L.push("D"+dn(x.t)+" "+hhmm(x.t)+" "+x.e+d);
  });
  L.push("");L.push("Tester notes - would you show it to a friend, and what would you say?");
  return L.join("\n");
}

    '<button id="dAuto">Auto-play to adult</button>'+
    '<button id="dForce">Force a mutation at next growth: '+(G.forceMut?"ON":"off")+'</button>'+
    '<select id="dRate" aria-label="Mutation chance"><option value="0.08333">Mutation 1 in 12</option><option value="0.16667">Mutation 1 in 6</option><option value="1">Mutation always</option></select>'+
    '<button id="dAway">Pretend I was away 25h</button>'+
    '<button id="dFriend">Make a test friend code</button>'+
    '<button id="dLog">Show play log</button>'+
    '<button id="dRestart">Erase save and start again</button><button id="dShow">Show save data</button><button id="dClose">Close panel</button></div><pre id="dOut"></pre></div>';
  var rate=G.mutRate||CFG.MUT;
  $("#dRate").value=rate>0.5?"1":(rate<0.12?"0.08333":"0.16667");
  d.querySelectorAll("[data-b]").forEach(function(el){
    el.addEventListener("click",function(){
      var b=+el.dataset.b;
      G.c=makeCreature(b,[],G.seed,"Hatched from the test panel.");G.phase="reveal";G.pending=null;G.playHatch=true;save();render();
    });
  });
  $("#dFast").addEventListener("click",function(){G.fast=!G.fast;save();render();});
  $("#dChoice").addEventListener("click",devChoice);
  $("#dAuto").addEventListener("click",devAuto);
  $("#dForce").addEventListener("click",function(){G.forceMut=!G.forceMut;save();render();});
  $("#dRate").addEventListener("change",function(e){G.mutRate=parseFloat(e.target.value);save();});
  $("#dRestart").addEventListener("click",function(){var keep=G.dev;wipe();G.dev=keep;save();render();});
  $("#dAway").addEventListener("click",function(){var c=G.c;if(!c||G.phase!=="home")return;c.lastSeen-=25*3600*1000;c.lastAwayDay=0;noteVisit();render();});
  $("#dFriend").addEventListener("click",function(){
    var keep=G,seed=Math.floor(Math.random()*1e9);
    G={v:1,phase:"home",seed:seed,answers:[Math.floor(Math.random()*4),0,0,0,0,0],c:null,dev:false,fast:true,plog:[],keep:[]};
    G.c=makeCreature(Math.floor(Math.random()*4),[],seed,"");
    while(G.c.stage<4)applyChoice(Math.random()<0.5?"a":"b");
    var code=toCode(G.c);G=keep;G.testCode=code;save();VIEW="bond";render();
  });
  $("#dLog").addEventListener("click",function(){$("#dOut").textContent=JSON.stringify(G.plog||[]);});
  $("#dShow").addEventListener("click",function(){$("#dOut").textContent=JSON.stringify(G);});
  $("#dClose").addEventListener("click",function(){G.dev=false;save();render();});
}

window.__sq1={G:function(){return G;},pickBlob:pickBlob,VIBE:VIBE,PERS:PERS,BLOBS:BLOBS,CHOICES:CHOICES,UP_AT:UP_AT,CFG:CFG,draw:drawCreature,KEY:KEY,devLife:devLife,choiceState:choiceState,nextChoice:nextChoice,render:render,toCode:toCode,fromCode:fromCode,bond:bond,doCare:doCare,noteVisit:noteVisit,chargeInfo:chargeInfo,setView:setView,limbScore:limbScore,SP:SP,reportText:reportText,importSave:importSave,setG:function(g){G=g;}};
noteVisit();
render();
})();
</script>
